<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Murmur call, final</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#050304}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.floor{position:absolute;left:-110px;top:582.4px;width:622px;height:441.6px;transform-origin:50% 100%;opacity:.78;filter:blur(30px);transition:opacity .6s ease}
.aur{position:absolute;left:-110px;top:-170px;width:622px;height:414px;transform-origin:50% 0;filter:blur(30px);transition:opacity .7s ease}
.floor i,.aur i{position:absolute;border-radius:50%}
.status{position:absolute;top:50px;left:0;right:0;margin:0;text-align:center;font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;letter-spacing:1.98px;color:rgba(255,248,238,.55);transition:opacity .5s}
.mur{position:absolute;white-space:nowrap;font-size:17px;font-weight:400;color:rgba(255,248,238,.78)}
.agents{position:absolute;top:60px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.av{position:relative;border-radius:50%;flex:none}
.av img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;display:block}
.av .ov{mix-blend-mode:plus-lighter;opacity:.4}
.av .rim{position:absolute;inset:-.5px;border-radius:50%;box-shadow:inset 0 0 0 .6px rgba(255,255,255,.35)}
.name{position:absolute;left:176px;top:116px;width:51px;height:9px;mix-blend-mode:lighten;opacity:.9;transition:opacity .6s}
.reply{position:absolute;top:310px;left:28px;width:346px;margin:0;text-align:center;font-size:36px;font-weight:300;line-height:1.16;letter-spacing:-.9px;color:#FFF8EE}
.w{display:inline-block;transition:color .35s ease}
.w.em{font-size:44px;color:#FFFFFF}
.w.dot{font-size:44px;font-weight:700;color:#FFFFFF}
.ctl{position:relative;width:58px;height:58px;box-sizing:border-box;border:0;border-radius:100px;cursor:pointer;display:grid;place-items:center;padding:0;background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(7.5px);backdrop-filter:blur(7.5px);box-shadow:-1px 3px 6px rgba(0,0,0,.08),-13px 43px 18px rgba(0,0,0,.01)}
.ctl::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from 76deg,rgba(64,64,64,.25) 2.9%,rgba(64,64,64,.175) 8.9%,rgba(255,255,255,.25) 16.7%,rgba(255,255,255,.25) 29.9%,rgba(64,64,64,.175) 52.1%,rgba(249,249,249,.5) 57.7%,rgba(255,255,255,.25) 79.8%,rgba(249,249,249,.25) 90.8%,rgba(64,64,64,.25) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.ctl:active{transform:scale(.96)}
button:focus-visible{outline:2px solid #FFB36B;outline-offset:3px}
@media (prefers-reduced-motion: reduce){.w,.floor,.aur{transition:none}}

.micg{transition:opacity .25s ease}
.status{transition:opacity 1s ease!important}
.agents{transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)!important}
.name{transition:opacity 1s ease .2s!important}
</style>
</helmet>
<main style="position: relative; width: 402px; height: 874px; overflow: hidden; background: #050304; color: #FFF8EE; font-family: 'Geist', -apple-system, 'Helvetica Neue', sans-serif">
  <div class="floor" aria-hidden="true" style="transform: scaleY({{fs}}); opacity: {{fo}}">
    <i style="left: 0; top: 115.2px; width: 420px; height: 307.2px; background: #E8432A"></i>
    <i style="left: 210px; top: 163.2px; width: 300px; height: 249.6px; background: #FF8A3C"></i>
    <i style="left: 140px; top: 240px; width: 260px; height: 192px; background: #FFE3B0"></i>
    <i style="left: -60px; top: 76.8px; width: 220px; height: 211.2px; background: rgba(47,59,255,.45)"></i>
  </div>
  <div class="aur" aria-hidden="true" style="transform: scaleY({{as}}); opacity: {{ao}}">
    <i style="left: 0; top: 54px; width: 420px; height: 270px; background: #2F3BFF"></i>
    <i style="left: 220px; top: 18px; width: 300px; height: 234px; background: #9B6BFF"></i>
    <i style="left: 120px; top: 0; width: 260px; height: 180px; background: #E3E9FF"></i>
  </div>
  <svg aria-hidden="true" width="402" height="874" style="position: absolute; inset: 0; opacity: .12; mix-blend-mode: overlay; pointer-events: none"><filter id="vg"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#vg)"></rect></svg>

  <p class="status" style="opacity: {{stO}}">{{status}}</p>
  <div class="agents" aria-label="On the call" style="opacity: {{agO}}; transform: translateX(-50%) translateY({{agY}}px)">
    <span class="av" style="width: 32px; height: 32px"><img src="va/agent2.png" alt="Ride-or-Die"><img class="ov" src="va/ov170.png" alt=""><i class="rim"></i></span>
    <span class="av big" style="width: 44px; height: 44px"><img src="va/agent1.png" alt="Die Hard"><img class="ov" src="va/ov171.png" alt=""><i class="rim"></i></span>
    <span class="av" style="width: 32px; height: 32px; opacity: .2"><img src="va/agent3.png" alt="Softie"><img class="ov" src="va/ov33.png" alt=""><i class="rim"></i></span>
  </div>
  <img class="name" src="va/name.png" alt="Die Hard" style="opacity: {{nmO}}">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{murmurs}}" as="m" hint-placeholder-count="0"><span class="mur" style="left: {{m.x}}px; top: {{m.y}}px; opacity: {{m.o}}; transform: translateY({{m.dy}}px); filter: blur({{m.b}}px)">{{m.t}}</span></sc-for>
  </div>

  <p class="reply" aria-live="polite" style="opacity: {{rO}}; filter: blur({{rB}}px); transform: translateY({{rY}}px)"><sc-for list="{{words}}" as="w" hint-placeholder-count="8"><span class="{{w.cls}}" style="opacity: {{w.o}}; color: {{w.c}}; filter: blur({{w.b}}px)">{{w.t}}</span>{{w.sp}}</sc-for></p>

  <div role="toolbar" aria-label="Call controls" style="position: absolute; left: 132px; top: 764px; display: flex; gap: 22px">
    <button type="button" class="ctl" aria-label="{{muteLabel}}" aria-pressed="{{muted}}" onClick="{{toggleMute}}">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><defs><mask id="mcut" maskUnits="userSpaceOnUse" x="0" y="0" width="22" height="22"><rect width="22" height="22" fill="#fff"></rect><path d="M3 2.6l16.4 16.4" stroke="#000" stroke-width="4.6" stroke-linecap="round"></path></mask></defs><g class="micg" style="opacity: {{unm}}"><path d="M14.2083 5.5C14.2083 3.72809 12.7719 2.29167 11 2.29167C9.22809 2.29167 7.79167 3.72809 7.79167 5.5V10.0833C7.79167 11.8552 9.22809 13.2917 11 13.2917C12.7719 13.2917 14.2083 11.8552 14.2083 10.0833V5.5Z" fill="#FFF3EA"></path><path d="M5.04167 10.5417C5.04167 12.1219 5.66942 13.6374 6.78682 14.7548C7.90423 15.8722 9.41975 16.5 11 16.5M11 16.5C12.5802 16.5 14.0958 15.8722 15.2132 14.7548C16.3306 13.6374 16.9583 12.1219 16.9583 10.5417M11 16.5V19.7083" stroke-width="1.74167" stroke-linecap="round" stroke="#FFF3EA"></path></g><g class="micg" mask="url(#mcut)" style="opacity: {{slash}}"><path d="M14.2083 5.5C14.2083 3.72809 12.7719 2.29167 11 2.29167C9.22809 2.29167 7.79167 3.72809 7.79167 5.5V10.0833C7.79167 11.8552 9.22809 13.2917 11 13.2917C12.7719 13.2917 14.2083 11.8552 14.2083 10.0833V5.5Z" fill="#FFF3EA"></path><path d="M5.04167 10.5417C5.04167 12.1219 5.66942 13.6374 6.78682 14.7548C7.90423 15.8722 9.41975 16.5 11 16.5M11 16.5C12.5802 16.5 14.0958 15.8722 15.2132 14.7548C16.3306 13.6374 16.9583 12.1219 16.9583 10.5417M11 16.5V19.7083" stroke-width="1.74167" stroke-linecap="round" stroke="#FFF3EA"></path></g><path class="micg" d="M3 2.6l16.4 16.4" stroke="#FFF3EA" stroke-width="1.9" stroke-linecap="round" style="opacity: {{slash}}"></path></svg>
    </button>
    <button type="button" class="ctl" aria-label="End call">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5L10 10M10 10L15 15M10 10L15 5M10 10L5 15" stroke-width="1.83333" stroke-linecap="round" stroke="#FFF3EA"></path></svg>
    </button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
// One loop of the call: you vent, the listener murmurs, then replies in a few words.
const TURNS = [
  { k: 'u', d: 5.2, h: .62, m: [['mm.', 80, 500, 1.0], ['wait, what?', 220, 470, 2.4]] },
  { k: 'u', d: 3.8, h: .95, m: [['no way.', 120, 478, .6], ['seriously?', 230, 450, 1.8]] },
  { k: 'a', w: 'Two lines, after three rounds of you? That’s not a decision. That’s a', em: 'shrug' },
  { k: 'u', d: 4.0, h: .9, m: [['no way.', 120, 478, .6], ['seriously?', 230, 450, 1.8]] },
  { k: 'a', w: 'Which part stings more: the two lines, or the no-reply?' }
];
const WS = .26, LEAD = .6, HOLD = 2.6, OUT = .8, GAP = .4;
const SCHED = (() => { let t = 0; return TURNS.map(x => { const n = x.k === 'a' ? x.w.split(' ').length + (x.em ? 1 : 0) : 0; const d = x.k === 'a' ? LEAD + n * WS + HOLD + OUT : x.d; const s = Object.assign({}, x, { s: t, e: t + d }); t += d + GAP; return s; }); })();
const TOTAL = SCHED[SCHED.length - 1].e + .8;
const FIRST_A = SCHED.find(x => x.k === 'a').s;
const clamp = v => Math.max(0, Math.min(1, v)), sm = v => { v = clamp(v); return v * v * (3 - 2 * v); };
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 0, L: .3, A: 0, muted: false }; }
  componentDidMount() {
    this.iv = setInterval(() => {
      const s = this.state, t = s.t + .05, T = t % TOTAL, cur = SCHED.find(x => T >= x.s && T < x.e);
      let tl = .2, ta = 0;
      if (cur && cur.k === 'u' && !s.muted) tl = cur.h * (.62 + .38 * Math.abs(Math.sin(T * 4.1) * Math.sin(T * 1.6 + 1)));
      if (cur && cur.k === 'a') ta = .85 + .2 * Math.abs(Math.sin(T * 5.3) * Math.sin(T * 2.1 + .4));
      this.setState({ t: t, L: s.L + (tl - s.L) * .16, A: s.A + (ta - s.A) * .12 });
    }, 50);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const s = this.state, T = s.t % TOTAL, cur = SCHED.find(x => T >= x.s && T < x.e);
    const murmurs = [];
    SCHED.forEach(x => { if (x.m) x.m.forEach(m => {
      const k = (T - x.s - m[3]) / 2.6, live = k >= 0 && k <= 1 && !s.muted;
      const inA = clamp(k / .18), outA = k > .7 ? clamp((1 - k) / .3) : 1, e = 1 - Math.pow(1 - clamp(k), 2);
      murmurs.push({ t: m[0], x: m[1], y: m[2], o: live ? (inA * outA).toFixed(2) : 0, dy: live ? (14 * (1 - inA) - 40 * Math.max(0, k - .2) / .8 * e).toFixed(1) : 0, b: live ? ((1 - inA) * 6 + (k > .7 ? (k - .7) * 13 : 0)).toFixed(1) : 0 });
    }); });
    const lastA = SCHED.filter(x => x.k === 'a' && T >= x.s && T < x.e + .2).pop();
    let words = [], rO = 0, rB = 0, rY = 0;
    if (lastA) {
      const age = T - lastA.s - LEAD, toks = lastA.w.split(' ').map(t => ({ t: t, cls: 'w' }));
      if (lastA.em) { toks.push({ t: lastA.em, cls: 'w em', tight: true }); toks.push({ t: '.', cls: 'w dot' }); }
      words = toks.map((x, k) => { const a = sm((age - k * WS) / .45); return { t: x.t, cls: x.cls, o: a > 0 ? Math.min(1, a * 2.5).toFixed(2) : 0, c: 'rgba(255,248,238,' + (.32 + .68 * a).toFixed(2) + ')', b: ((1 - a) * 4).toFixed(1), sp: x.tight || k === toks.length - 1 ? '' : ' ' }; });
      if (lastA.em) { words[words.length - 3].sp = ' '; words[words.length - 2].sp = ''; words.forEach(w => { if (w.cls !== 'w') w.c = '#FFFFFF'; }); }
      const out = clamp((T - (lastA.e - OUT)) / OUT);
      rO = (1 - out * .85).toFixed(2); rB = (out * 9).toFixed(1); rY = (-out * 10).toFixed(1);
      if (T >= lastA.e) rO = 0;
    }
    const joined = T >= FIRST_A - .2, agentNow = cur && cur.k === 'a';
    return {
      status: s.muted ? 'MUTED' : 'LISTENING', stO: T >= FIRST_A - .9 ? 0 : 1,
      agO: T >= FIRST_A + .5 ? 1 : 0, agY: T >= FIRST_A + .5 ? 0 : -6, nmO: T >= FIRST_A + .5 ? .9 : 0,
      hs: agentNow ? (1 + (s.A - .85) * .9).toFixed(3) : 1, ho: agentNow ? .9 : .25,
      fs: (1 + (s.L - .6) * .885).toFixed(3), fo: s.muted ? .1 : clamp((s.L - .22) * 2.2).toFixed(2),
      as: (.8 + s.A * .3).toFixed(3), ao: clamp(s.A * 1.4).toFixed(2),
      murmurs: murmurs, words: words, rO: rO, rB: rB, rY: rY,
      muted: s.muted, slash: s.muted ? 1 : 0, unm: s.muted ? 0 : 1, muteLabel: s.muted ? 'Unmute' : 'Mute',
      toggleMute: () => this.setState({ muted: !s.muted })
    };
  }
}
</script>
</body>
</html>
