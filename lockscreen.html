<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Lava" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="mobile.css?v=3" />
  <title>V2 Prototype</title>
  <link rel="stylesheet" href="vt.css?v=3" />
  <script src="fit-extra.js?v=2"></script>
  <style>
    /* Lock screen from Figma "Designing Shits" 237:5962 — designed at 532 × 1148, scaled to fit */
    html, body { margin: 0; height: 100%; background: #0d0d0d; overflow: hidden; }
    body { display: grid; place-items: center; font-family: 'Inter', system-ui, sans-serif; }
    .lock-frame { position: absolute; left: 50%; top: 50%; width: 532px; height: 1148.317px; overflow: hidden; background: #000;
      transform: translate(-50%, -50%) scale(var(--lock-fit, 1)); transform-origin: center; }

    /* The wallpaper stays put for the whole transition */
    .lock-wallpaper { position: absolute; inset: 0; overflow: hidden; transition: opacity .5s cubic-bezier(.77, 0, .175, 1); }
    .lock-frame.is-dim .lock-wallpaper { opacity: 0; }
    .lock-wallpaper img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Every UI element lives in .lock-ui, so it can leave as one */
    .lock-ui { position: absolute; inset: 0; will-change: transform; }

    .lock-datetime { position: absolute; left: 2px; top: 114px; width: 528px; height: 163px; display: block; }
    .lock-widgets { position: absolute; left: 35px; top: 294px; width: 457px; height: 83px; }
    .lock-widgets > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* The vector shape: tap it to start the transition (blob.svg is cropped to x 260–340 of the row) */
    .lock-blob { position: absolute; left: 260px; top: 4.5px; width: 80.5px; height: 74.5px; padding: 0; border: 0; background: none; cursor: pointer;
      transition: opacity .55s ease, transform 160ms ease-out; -webkit-tap-highlight-color: transparent; }
    .lock-blob img { width: 100%; height: 100%; display: block; }
    .lock-blob:active, .lock-blob.is-sim { transform: scale(.97); }
    .lock-blob.is-pressed { opacity: .4; }   /* fades to 40% of its current opacity */

    .lock-buttons { position: absolute; left: 0; bottom: 80px; width: 532px; height: auto; display: block; }

    /* The vent page sits underneath, already loaded and held dark; the lock screen reveals it */
    .lock-vent { position: absolute; left: 0; top: -4px; width: 402px; height: 874px; border: 0; background: #000; pointer-events: none;
      transform: scale(1.3234); transform-origin: 0 0; }
    .lock-wallpaper { z-index: 1; }
    .lock-ui { z-index: 2; }
    .lock-frame.is-vent .lock-vent { pointer-events: auto; }
    .lock-frame.is-vent .lock-wallpaper, .lock-frame.is-vent .lock-ui { display: none; }

    @media (pointer: coarse) {
      .lock-frame { position: fixed; left: 0; top: 0; height: var(--lock-h, 1148.317px); height: calc((100dvh + var(--fx, 0px) - var(--lock-y, 0px)) / var(--lock-fit, 1)); transform-origin: 0 0; transform: translateY(var(--lock-y, 0px)) scale(var(--lock-fit, 1)); }
      .lock-vent { height: calc(var(--lock-h, 1148.317px) / 1.3234 + 4px); height: calc((100dvh + var(--fx, 0px) - var(--lock-y, 0px)) / var(--lock-fit, 1) / 1.3234 + 4px); }
    }
    @media (prefers-reduced-motion: reduce) { .lock-ui { transition: opacity .2s; transform: none !important; } .lock-frame.is-leaving .lock-ui { opacity: 0; } }
  </style>
</head>
<body>
  <main class="lock-frame" id="lock">
    <iframe class="lock-vent" id="lockVent" title="Ready to vent" tabindex="-1" aria-hidden="true"></iframe>
    <div class="lock-wallpaper"><img src="assets/lock/wallpaper.jpg" alt="" /></div>

    <div class="lock-ui" id="lockUi">
      <img class="lock-datetime" src="assets/lock/date-time.svg" alt="Sun Oct 18, 12:57" />
      <div class="lock-widgets">
        <img src="assets/lock/widgets.svg" alt="" />
        <button class="lock-blob" id="lockBlob" type="button" aria-label="Start venting"><img src="assets/lock/blob.svg" alt="" /></button>
      </div>

      <img class="lock-buttons" src="assets/lock/buttons.png" alt="" />
    </div>

  </main>

  <script>
    (function () {
      const frame = document.getElementById('lock');
      const blob = document.getElementById('lockBlob');
      const ui = document.getElementById('lockUi');
            let started = false;

      function fit() {
        const de = document.documentElement, root = de.style, vv = window.visualViewport;
        const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        const vw = de.clientWidth;
        let vh = Math.max(de.clientHeight, window.innerHeight || 0, vv ? vv.height : 0);
        if (standalone && screen.height > screen.width) vh = Math.max(vh, screen.height);
        vh = Math.min(vh, Math.max(screen.height, screen.width));
        if (matchMedia('(pointer: coarse)').matches) {
          // phone: fill the width, let the frame (and the vent page under it) take the screen's height
          const s = vw / 532;
          // the design's status strip (54pt = 71.5 here) is trimmed by 58, and from the home screen the
          // frame first moves down by the status bar's height, so both ways look the same
          const probe = document.createElement('div');
          probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top)';
          de.appendChild(probe); const safe = probe.offsetHeight; probe.remove();
          const fy = safe - 58 * s;   // under the status bar if the page runs behind it (safe > 0), strip trimmed
          root.setProperty('--lock-fit', s); root.setProperty('--lock-h', ((vh - fy) / s) + 'px'); root.setProperty('--lock-y', fy + 'px');
        } else {
          root.setProperty('--lock-fit', Math.min((vw - 32) / 532, (vh - 56) / 1148.317));
        }
      }
      addEventListener('resize', fit); addEventListener('pageshow', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit); fit();

      // Critically damped spring (ω = 13.2 rad/s) sampled into a CSS linear() easing, so it runs as an ordinary
      // off-main-thread animation: it covers ~99% of the distance in 500ms, with no bounce on exit.
      const SLIDE = 500;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      function springEasing(omega, ms, samples) {
        const pts = [];
        for (let i = 0; i <= samples; i++) { const t = (i / samples) * ms / 1000; pts.push((1 - (1 + omega * t) * Math.exp(-omega * t)).toFixed(4)); }
        pts[0] = '0'; pts[samples] = '1';
        return 'linear(' + pts.join(', ') + ')';
      }
      const slideEasing = springEasing(13.2, SLIDE, 40);

      // The vent page loads now, underneath, and waits for "play"
      const vent = document.getElementById('lockVent');
      let ventReady = false, wantPlay = false;
      try { localStorage.setItem('hc.stage', 'home'); } catch (e) {}
      // demo autoplay is off by default: the blob and the voice button wait for a tap, and the call ends when
      // you hang up. Add ?auto=1 to bring the timed demo back (blob after 3s, voice button 4s after the vent page shows)
      const AUTO = /[?&]auto=1\b/.test(location.search);
      vent.src = 'index.html?hold' + (AUTO ? '&auto' : '');
      // the autoplay tap is a real-looking press: the blob presses in for a beat, then the click dims it to 40%
      if (AUTO) addEventListener('load', () => setTimeout(() => {
        if (started) return;
        blob.classList.add('is-sim');
        setTimeout(() => { blob.click(); blob.classList.remove('is-sim'); }, 140);
      }, 3000));
      function playVent() { if (ventReady) vent.contentWindow.postMessage('lock-play', '*'); else wantPlay = true; }
      addEventListener('message', e => { if (e.data === 'lock-ready' && e.source === vent.contentWindow) { ventReady = true; if (wantPlay) playVent(); } });

      blob.addEventListener('click', () => {
        if (started) return;
        started = true;
        blob.classList.add('is-pressed');                    // 1 · shape fades to 40% ...
        if (reduceMotion) frame.classList.add('is-leaving'); //     ... while all UI springs up and out at once, wallpaper untouched
        else ui.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-100%)' }], { duration: SLIDE, easing: slideEasing, fill: 'forwards' });
        playVent();                                          //     ... and the vent page starts its entrance underneath
        setTimeout(() => frame.classList.add('is-dim'), SLIDE * 0.8);   // 2 · wallpaper fades out at 80% of the slide
        setTimeout(() => frame.classList.add('is-vent'), SLIDE * 0.8 + 500);  // 3 · lock layers go; the vent page takes touches
      });


      addEventListener('pageshow', () => { started = false; frame.classList.remove('is-leaving', 'is-dim', 'is-vent'); ui.getAnimations().forEach(a => a.cancel()); blob.classList.remove('is-pressed'); });
    })();
  </script>
</body>
</html>
