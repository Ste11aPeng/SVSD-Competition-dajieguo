  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Let It Go</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <style>
    /* V2 frame: a 402×874 phone on black */
    :root {
      color-scheme: dark;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --font-body: "Geist", -apple-system, system-ui, sans-serif;
      --ink: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b0b0b; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body { display: grid; place-items: center; min-height: 100dvh; overflow: hidden; }

    .phone {
      position: relative; width: 402px; height: 874px; overflow: hidden; background: #000;
      isolation: isolate; -webkit-user-select: none; user-select: none;
      transform-origin: 50% 50%; transform: scale(var(--fit, 1));
      font-family: var(--font-body); color: var(--ink);
    }
    @media (pointer: coarse) {
      html, body { height: 100dvh; background: #000; }
      body { display: block; }
      .phone { position: fixed; left: 0; top: 0; height: calc(100dvh / var(--fit, 1)); transform-origin: 0 0; }
    }
    #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

    /* Forget: a round glass button. Translucent blurred fill, a hairline rim that catches light on
       opposite edges (the gradient border is a masked pseudo-element), soft white label. */
    .forget {
      position: absolute; left: 50%; bottom: 72px; z-index: 2;
      width: 112px; height: 112px; margin-left: -56px; border: 0; padding: 0; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer;
      font: 400 19px/1 var(--font-body); letter-spacing: -.01em; color: rgba(255, 255, 255, .9);
      background: radial-gradient(120% 120% at 30% 15%, rgba(255, 255, 255, .06), rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, .03));
      -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, .04);
      transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out), opacity 400ms var(--ease-out);
    }
    .forget::before {
      content: ""; position: absolute; inset: 0; border-radius: 50%; padding: 1.5px; pointer-events: none;
      background: linear-gradient(135deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, .14) 32%, rgba(255, 255, 255, .08) 62%, rgba(255, 255, 255, .6));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
    }
    .forget:active, .forget.is-pressed { transform: scale(.94); background-color: rgba(255, 255, 255, .1); color: #fff; transition-duration: 90ms; }
    .forget:focus-visible { outline: 2px solid rgba(255, 255, 255, .6); outline-offset: 4px; }
    /* once pressed it gets out of the way fast: a quick fade with a slight shrink */
    .phone[data-gone] .forget { opacity: 0; transform: scale(.94); pointer-events: none; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
    @media (prefers-reduced-motion: reduce) { .forget { transition: opacity 200ms ease; } .forget:active, .forget.is-pressed { transform: none; } }

  </style>
<main class="phone" id="phone">
  <canvas id="gl" role="img" aria-label="Oct 16, vanished package from the lobby. The card turns over and burns."></canvas>
  <button class="forget" id="forget">Forget</button>

</main>

  const card = program(HEAD + POSE_GLSL + `
    attribute vec2 aUV; varying vec2 vP;
    void main(){
      vec2 p = mix(vec2(-${f(PAD)}), vec2(${f(CW + PAD)}, ${f(CH + PAD)}), aUV);
      vP = p; gl_Position = toClip(pose(p));
    }`, `#extension GL_OES_standard_derivatives : enable
    precision highp float;` + NOISE_GLSL + `
    uniform sampler2D uTex; uniform float uR, uTime, uSeed, uFire, uAlpha;
    varying vec2 vP;
    const vec2 SZ = vec2(${f(CW)}, ${f(CH)});
    vec4 face(vec2 p){ vec2 uv = p / SZ; if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec4(0.0); return texture2D(uTex, uv); }
    void main(){
      vec2 p = vP;
      vec4 tex = face(p);
      float e = fBurn(p, uSeed) - uR;          // distance to the burn front; < 0 is gone
      float aa = max(fwidth(e), 0.25);
      float nA = vnoise(p * 0.09 + uTime * 0.35 + uSeed);
      float nB = vnoise(p * 0.22 - vec2(0.0, uTime * 0.9) + uSeed);
      float hl = smoothstep(0.58, 0.86, vnoise(p * 0.06 + vec2(uSeed, -uTime * 0.7)));   // local hot spots
      float rimW = 1.0 + 2.6 * nA + 2.5 * hl;
      float charW = 2.5 + 7.0 * vnoise(p * 0.06 + 7.0 + uSeed);
      float scorchW = 4.0 + 8.0 * vnoise(p * 0.035 + 21.0 + uSeed);

      // paper ahead of the front: brown scorch → charred black → red heat → the glowing line
      vec3 c = tex.rgb / max(tex.a, 0.001);
      float scorch = 1.0 - smoothstep(rimW, rimW + charW + scorchW, e);
      float chr = 1.0 - smoothstep(rimW, rimW + charW, e);
      c = mix(c, c * vec3(0.62, 0.45, 0.36) + vec3(0.10, 0.04, 0.0), scorch * 0.9);
      c = mix(c, vec3(0.22, 0.10, 0.035), chr * 0.85);
      c = mix(c, vec3(0.03, 0.018, 0.012), pow(chr, 3.0));
      float heat = 1.0 - smoothstep(0.0, rimW + charW * 0.9, e);
      c += vec3(0.80, 0.20, 0.025) * heat * heat * (0.25 + 0.75 * nB);
      float rim = 1.0 - smoothstep(0.0, rimW, e);
      vec3 rimCol = mix(vec3(0.98, 0.36, 0.05), vec3(1.0, 0.70, 0.26), nB);
      rimCol = mix(rimCol, vec3(1.0, 0.80, 0.42), hl);
      c = mix(c, rimCol * (1.0 + 0.25 * hl), rim * (0.35 + 0.65 * smoothstep(0.15, 0.6, nA + hl)));

      // light from the burning edge flickering on the paper just ahead of it, climbing with it
      float above = (SZ.y - p.y) - max(uR, 0.0);
      float flick = 0.55 + 0.45 * vnoise(vec2(p.x * 0.025 + uSeed, uTime * 7.0)) * vnoise(vec2(p.x * 0.06, uTime * 11.0 + 5.0));
      c += vec3(1.0, 0.48, 0.14) * uFire * flick * 0.55 * exp(-max(above, 0.0) / (45.0 + 40.0 * flick));

      float alpha = tex.a * smoothstep(-aa, aa, e);
      vec3 col = c * alpha;
      // behind the front: glow dying off, and specks of residue still glowing
      float eb = min(e, 0.0);   // (exp of a large positive e overflows to inf, and 0 × inf is NaN)
      float behind = tex.a * (1.0 - smoothstep(-aa, aa, e));
      float glow = exp(eb / (2.2 + 3.5 * nA + 4.0 * hl)) * (0.45 + 0.9 * hl);
      float speck = smoothstep(0.80, 0.93, vnoise(p * 0.45 + uSeed + 40.0)) * exp(eb / 10.0) * (0.3 + 0.5 * nB);
      col += behind * (vec3(1.0, 0.42, 0.07) * glow + vec3(1.0, 0.45, 0.08) * speck);
      gl_FragColor = vec4(col, alpha) * uAlpha;
    }`);
  const GX = 34, GY = 56;
  const meshUV = [], meshIdx = [];
  for (let j = 0; j <= GY; j++) for (let i = 0; i <= GX; i++) meshUV.push(i / GX, j / GY);
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) { const a = j * (GX + 1) + i, b = a + 1, c = a + GX + 1, d = c + 1; meshIdx.push(a, b, c, b, d, c); }
  const meshBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(meshUV), gl.STATIC_DRAW);
  const idxBuf = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(meshIdx), gl.STATIC_DRAW);

  const pts = program(HEAD + `
    attribute vec2 aPos; attribute float aSize; attribute vec4 aCol; attribute float aSoft; uniform float uDpr;
    varying vec4 vCol; varying float vSoft;
    void main(){ vCol = aCol; vSoft = aSoft; gl_PointSize = aSize * uDpr; gl_Position = toClip(aPos); }`, `
    precision highp float; varying vec4 vCol; varying float vSoft;
    void main(){
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float core = 1.0 - smoothstep(0.35, 0.75, d);
      float halo = (1.0 - smoothstep(0.0, 1.0, d)) * vSoft;
      gl_FragColor = vCol * clamp(core + halo, 0.0, 1.0);
    }`);
  const STRIDE = 8, MAX_PTS = 3000;
  const ptBuf = gl.createBuffer();
  const glowData = new Float32Array(MAX_PTS * STRIDE), flatData = new Float32Array(MAX_PTS * STRIDE);

  // ---------- card faces: the two artworks, with rounded corners ----------
  const TEX_S = 3;
  const texFront = gl.createTexture(), texBack = gl.createTexture();
  const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  function face(img, tex) {
    const cv = document.createElement('canvas'); cv.width = CW * TEX_S; cv.height = CH * TEX_S;
    const g = cv.getContext('2d'); g.scale(TEX_S, TEX_S);
    g.beginPath(); g.roundRect(0, 0, CW, CH, CR); g.clip();
    g.drawImage(img, 0, 0, CW, CH);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  // ---------- particles (seeded, fixed step) ----------
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  let seed = 0, spawns = [], live = [], spawnIdx = 0, simT = 0;
  const N_EMBER = 570, N_FLAKE = 54;
  const inCard = (x, y) => { const qx = Math.max(Math.abs(x - CW / 2) - (CW / 2 - CR), 0), qy = Math.max(Math.abs(y - CH / 2) - (CH / 2 - CR), 0); return Math.hypot(qx, qy) <= CR; };
  function plan(s) {
    const R = rng(s * 7919 + 13); seed = (s * 37.17) % 97;
    spawns = []; live = []; spawnIdx = 0; simT = 0;
    const pickPt = () => { let x, y; do { x = R() * CW; y = R() * CH; } while (!inCard(x, y)); return [x, y]; };
    const burnsAt = (x, y) => when(Math.max(fBurn(x, y, seed), -20));
    const r6 = () => [R(), R(), R(), R(), R(), R()];
    for (let i = 0; i < N_EMBER; i++) { const [x, y] = pickPt(); spawns.push({ x, y, t: burnsAt(x, y) + R() * 0.12, kind: 'ember', r: r6() }); }
    for (let i = 0; i < N_FLAKE; i++) { const [x, y] = pickPt(); spawns.push({ x, y, t: burnsAt(x, y) + R() * 0.25, kind: 'flake', r: r6() }); }
    spawns.sort((a, b) => a.t - b.t);
  }
  function spawn(s, t) {
    const r = s.r;
    const [wx, wy] = warp(s.x, s.y);
    if (s.kind === 'ember') return { kind: 'ember', glow: true, x: wx, y: wy, vx: (r[0] - 0.5) * 26, vy: -6 - r[1] * 34, buoy: 14 + r[2] * 40, life: 0.45 + r[3] * 0.9, age: 0, size: 1.1 + r[4] * 1.2, ph: r[5] * 6.28 };
    return { kind: 'flake', glow: false, x: wx, y: wy, vx: (r[0] - 0.5) * 30, vy: -20 - r[1] * 40, life: 3.5 + r[3] * 4, age: 0, size: 1.0 + r[4] * 1.8, a: 0.15 + r[2] * 0.35, ph: r[5] * 6.28 };
  }
  function step(t, dt) {
    while (spawnIdx < spawns.length && spawns[spawnIdx].t <= t) live.push(spawn(spawns[spawnIdx++], t));
    for (const p of live) {
      p.age += dt;
      if (p.kind === 'flake') {
        p.vy += 9 * dt; p.vx += (vnoise(p.x * 0.02 + 50, p.y * 0.02 + t * 0.5) - 0.5) * 60 * dt;
        const dr = Math.exp(-0.9 * dt); p.vx *= dr; p.vy *= dr;
      } else {
        // hot air: buoyancy up, a little turbulence sideways, drag
        p.vy -= p.buoy * dt;
        p.vx += (vnoise(p.x * 0.035, p.y * 0.035 - t * 1.4) - 0.5) * 220 * dt;
        const dr = Math.exp(-1.6 * dt); p.vx *= dr; p.vy *= dr;
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    live = live.filter(p => p.age < p.life);
  }
  function emberColor(T) {   // cooling: white-yellow → orange → red → out
    if (T > 0.75) { const k = (T - 0.75) / 0.25; return [1, 0.62 + 0.3 * k, 0.22 + 0.4 * k]; }
    if (T > 0.35) { const k = (T - 0.35) / 0.4; return [1, 0.36 + 0.26 * k, 0.06 + 0.16 * k]; }
    const k = T / 0.35; return [0.55 + 0.45 * k, 0.1 + 0.26 * k, 0.03 + 0.03 * k];
  }

  // ---------- state ----------
  // the sequence clock only runs while frames are drawn, so a page opened in the background
  // (or still loading in a viewer) starts on the card's front instead of already burned
  let clock = 0, last = null;
  const Q = new URLSearchParams(location.search);
  const frozen = Q.has('t') ? parseFloat(Q.get('t')) : null;   // ?t=5 freezes the sequence there (for checking frames)
  function reset() {
    plan(Math.floor(Math.random() * 1e6));
    clock = 0;
    delete phone.dataset.gone;
  }
  const forgetBtn = document.getElementById('forget');
  // Tapping Forget while the front is up lets the card go at once (mid-turn or on the back, the sequence
  // simply carries on to the press); a tap on the empty black screen plays it all again
  // manual: the card waits face up; a tap on it turns it over (and back), Forget burns it
  let pressed = false, flipFrom = 0, flipTo = 0, flipT0 = 0;
  const nowS = () => performance.now() / 1000;
  function flipNow() { return flipFrom + (flipTo - flipFrom) * ease(clamp01((nowS() - flipT0) / T_FLIP)); }
  function turnTo(target) { flipFrom = flipNow(); flipTo = target; flipT0 = nowS(); }
  const facingBack = () => { const a = flipTo % (2 * Math.PI); return a > Math.PI / 2 && a < Math.PI * 1.5; };
  function onCard(e) {
    const r = canvas.getBoundingClientRect(), sx = FW / r.width, x = (e.clientX - r.left) * sx, y = (e.clientY - r.top) * sx;
    return x > cardX() - 10 && x < cardX() + CW + 10 && y > cardTop() - 10 && y < cardTop() + CH + 10;
  }
  forgetBtn.addEventListener('click', () => {
    if (pressed) return; pressed = true;
    const burn = () => { clock = T_PRESS + PRESS_LEN; };
    if (facingBack()) { turnTo(flipTo + Math.PI); setTimeout(burn, T_FLIP * 1000 + 80); } else burn();
  });
  canvas.addEventListener('click', (e) => {
    if (clock > T_GONE + 1.5) { reset(); pressed = false; flipFrom = flipTo = 0; return; }
    if (!pressed && onCard(e)) turnTo(flipTo + Math.PI);
  });
  canvas.style.cursor = 'pointer';

  // ---------- sizing ----------
  function fit() {
    const coarse = matchMedia('(pointer: coarse)').matches;
    const vw = document.documentElement.clientWidth, vh = innerHeight;
    const s = coarse ? vw / 402 : Math.min(1, vw / 402, vh / 874);
    document.documentElement.style.setProperty('--fit', s);
    FW = 402; FH = phone.offsetHeight;
    dpr = Math.min(2, (devicePixelRatio || 1) * s);   // 2x is plenty for the burn and keeps phones at frame rate
    canvas.width = Math.round(FW * dpr); canvas.height = Math.round(FH * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', fit);

  // ---------- render ----------
  function attrib(prog, name, size, stride, off) { const l = gl.getAttribLocation(prog.p, name); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, size, gl.FLOAT, false, stride, off); return l; }
  const ease = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const clamp01 = x => Math.min(1, Math.max(0, x));

  function render(t) {
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.enable(gl.BLEND);
    // two half-turns in the same direction: front → back, then back → front again
    const turn = flipNow() % (2 * Math.PI), k = clamp01((t - T_BURN) / (T_GONE - T_BURN));
    const appear = clamp01(t / 0.5);
    poseU = {
      flip: turn, scale: 1 + 0.05 * Math.abs(Math.sin(turn)), time: t,
      sag: Math.pow(k, 1.5), rot: -0.035 * k * k,
      lift: 22 * k + 34 * Math.pow(k, 2.4) - (1 - appear) * 12,   // drifts up from the moment it catches, lighter and faster as it burns
      ox: cardX(), oy: cardTop()
    };
    // facing away (90°–270°): draw the back unmirrored with the angle folded back; past 270° the front again
    const showBack = turn > Math.PI / 2 && turn < Math.PI * 1.5;
    poseU.flip = showBack ? turn - Math.PI : turn > Math.PI * 1.5 ? turn - 2 * Math.PI : turn;
    const R = burnR(t);
    const lit = clamp01((t - T_BURN) / 0.35);           // the burning edge lights the paper just ahead of it

    if (t < T_GONE + 0.2) {                              // the card
      gl.useProgram(card.p);
      gl.uniform2f(card.u.uFrame, FW, FH); gl.uniform2f(card.u.uOrigin, poseU.ox, poseU.oy);
      gl.uniform1f(card.u.uFlip, poseU.flip); gl.uniform1f(card.u.uSag, poseU.sag); gl.uniform1f(card.u.uRot, poseU.rot);
      gl.uniform1f(card.u.uLift, poseU.lift); gl.uniform1f(card.u.uScale, poseU.scale); gl.uniform1f(card.u.uTime, t);
      gl.uniform1f(card.u.uR, R); gl.uniform1f(card.u.uSeed, seed); gl.uniform1f(card.u.uFire, lit * 0.6); gl.uniform1f(card.u.uAlpha, appear);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, showBack ? texBack : texFront); gl.uniform1i(card.u.uTex, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, meshBuf); attrib(card, 'aUV', 2, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.drawElements(gl.TRIANGLES, meshIdx.length, gl.UNSIGNED_SHORT, 0);
    }

    // embers and ash
    let ng = 0, nf = 0;
    const put = (arr, n, x, y, size, r, g, b, a, soft) => { const o = n * STRIDE; arr[o] = x; arr[o + 1] = y; arr[o + 2] = size; arr[o + 3] = r * a; arr[o + 4] = g * a; arr[o + 5] = b * a; arr[o + 6] = a; arr[o + 7] = soft; };
    for (const p of live) {
      const T = 1 - p.age / p.life;
      if (p.glow) {
        const [r, g, b] = emberColor(T), a = Math.min(1, T / 0.12) * (0.65 + 0.35 * Math.sin(t * 20 + p.ph * 9));
        if (ng < MAX_PTS) put(glowData, ng++, p.x, p.y, p.size * (0.6 + 0.4 * T) * 2.1, r, g, b, a, 0.5);
      } else {
        const a = p.a * Math.min(1, p.age / 0.6) * Math.min(1, (p.life - p.age) / 1.2);
        if (nf < MAX_PTS) put(flatData, nf++, p.x, p.y, p.size * 2, 0.86, 0.85, 0.83, a, 0.2);
      }
    }
    if (ng || nf) {
      gl.useProgram(pts.p); gl.uniform2f(pts.u.uFrame, FW, FH); gl.uniform1f(pts.u.uDpr, dpr);
      gl.bindBuffer(gl.ARRAY_BUFFER, ptBuf);
      const S = STRIDE * 4;
      const draw = (data, n) => { gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, n * STRIDE), gl.DYNAMIC_DRAW); attrib(pts, 'aPos', 2, S, 0); attrib(pts, 'aSize', 1, S, 8); attrib(pts, 'aCol', 4, S, 12); attrib(pts, 'aSoft', 1, S, 28); gl.drawArrays(gl.POINTS, 0, n); };
      if (nf) { gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); draw(flatData, nf); }
      if (ng) { gl.blendFunc(gl.ONE, gl.ONE); draw(glowData, ng); }
      for (let l = 1; l < 4; l++) gl.disableVertexAttribArray(l);   // the card only feeds attribute 0
    }
  }

  const DT = 1 / 120;
  function frame(now) {
    if (last !== null && document.visibilityState === 'visible') clock += Math.min((now - last) / 1000, 0.1);
    if (!pressed && clock > 0.6) clock = 0.6;   // faded in, then it waits for the person
    last = now;
    const t = frozen !== null ? frozen : clock;
    if (t >= T_PRESS + PRESS_LEN) phone.dataset.gone = '';    // the button leaves as soon as it has been pressed
    forgetBtn.classList.toggle('is-pressed', t >= T_PRESS && t < T_PRESS + PRESS_LEN);
    while (simT + DT <= t) { simT += DT; step(simT, DT); }
    render(t);
    requestAnimationFrame(frame);
  }

  fit();
  Promise.all([loadImg(FRONT_SRC), loadImg(BACK_SRC), document.fonts.load('600 16px Geist').catch(() => {})]).then(([front, back]) => {
    face(front, texFront); face(back, texBack);
    plan(Q.has('seed') ? +Q.get('seed') : 1);
    requestAnimationFrame(frame);
  });
})();
</script>

<script>
/* inside the calendar: once the card has burned away, hand control back */
(function(){if(parent===window)return;var ph=document.getElementById('phone');var sent=false;
  new MutationObserver(function(){if(sent||!ph.hasAttribute('data-gone'))return;sent=true;setTimeout(function(){try{parent.postMessage({letgo:'done'},'*')}catch(e){}},3600)}).observe(ph,{attributes:true,attributeFilter:['data-gone']});})();
</script></body></html>
