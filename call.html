      const db = 20 * Math.log10(Math.sqrt(sum / this.buf.length) + 1e-7), lv = clamp((db + 58) / 40);
      this.mic += (lv - this.mic) * (lv > this.mic ? .55 : .12);
    }
    let tl = .2, ta = 0;
    if (s.live) {
      const v = this.lv, speaking = !s.muted && this.mic > .3;
      if (v.phase === 'u') {
        if (speaking) { if (v.segStart < 0) v.segStart = t; v.lastVoice = t; v.voiced += .05; }
        const quiet = t - v.lastVoice;
        // a short pause after a real phrase: murmur
        if (!speaking && v.segStart >= 0 && quiet > .55 && quiet < 1.2 && t - v.segStart > .9 && t - v.lastMur > 2.2) {
          const topic = topicOf(v.heard + ' ' + (v.live || '')), pool = MURMURS[topic];
          const sl = SLOTS[v.slot++ % SLOTS.length];
          v.murs.push({ text: pool[Math.floor(Math.random() * pool.length)], x: sl[0], y: sl[1], at: t });
          v.lastMur = t; v.segStart = -1;
        }
        // a longer pause after enough talking: the listener answers
        if (!speaking && v.voiced > 2.5 && quiet > 1.6) {
          const topic = topicOf(v.heard + ' ' + (v.live || '')), bank = REPLIES[topic], i = v.n[topic] || 0;
          v.reply = bank[i % bank.length]; v.n[topic] = i + 1;
          v.phase = 'a'; v.aStart = t; v.aEnd = t + replyLen(v.reply); v.joined = true; v.voiced = 0; v.segStart = -1;
        }
        tl = s.muted ? .2 : .32 + this.mic * .72;
      } else {
        ta = .85 + .2 * Math.abs(Math.sin(t * 5.3) * Math.sin(t * 2.1 + .4));
        if (t >= v.aEnd) { v.phase = 'u'; v.heard = ''; v.lastVoice = t; }
      }
      v.murs = v.murs.filter(m => t - m.at < 2.8);
    } else {
      const T = Math.min(t, TOTAL), cur = SCHED.find(x => T >= x.s && T < x.e);
      // autoplay (?auto): when the scripted call has finished, end it, as a person tapping the end button would
      if (t >= TOTAL && window.__auto && !this.ended) { this.ended = true; const end = document.querySelector('[aria-label="End call"]'); if (end) end.click(); }
      if (cur && cur.k === 'u' && !s.muted) tl = cur.h * (.62 + .38 * Math.abs(Math.sin(T * 4.1) * Math.sin(T * 1.6 + 1)));
      if (cur && cur.k === 'a') ta = .85 + .2 * Math.abs(Math.sin(T * 5.3) * Math.sin(T * 2.1 + .4));
    }
    // the agent's glow blooms quickly when they cut in (ahead of their words) and settles back more slowly
    this.setState({ t: t, L: s.L + (tl - s.L) * .16, A: s.A + (ta - s.A) * (ta > s.A ? .22 : .12) });
  }
  componentWillUnmount() { this.stopped = true; if (this.audio) this.audio.pause(); clearInterval(this.iv); if (this.rec) try { this.rec.stop(); } catch (e) {} if (this.stream) this.stream.getTracks().forEach(t => t.stop()); if (this.actx) this.actx.close(); if (this.wake) document.removeEventListener('pointerdown', this.wake); }
  renderVals() {
    const s = this.state;
    let murmurs = [], words = [], rO = 0, rB = 0, rY = 0, joined, agentNow, stO, agO;
    if (s.live && this.lv) {
      const v = this.lv, t = s.t;
      murmurs = v.murs.map(m => murmurView(m.text, m.x, m.y, (t - m.at) / 2.6, !s.muted));
      agentNow = v.phase === 'a';
      if (v.reply && t < v.aEnd + .2 && agentNow) {
        words = wordsFor(v.reply, t - v.aStart - LEAD);
        const out = clamp((t - (v.aEnd - OUT)) / OUT);
        rO = (1 - out * .85).toFixed(2); rB = (out * 5).toFixed(1); rY = (-out * 10).toFixed(1);
      }
      joined = v.joined; stO = joined ? 0 : 1; agO = joined && t - v.aStart > .5 ? 1 : 0;
    } else {
      // captions are drawn by call-fx.js; here: what holds the line on top
      const T = Math.min(s.t, TOTAL), cur = SCHED.find(x => T >= x.s && T < x.e);
      // LISTENING until Ride-or-Die first speaks; from then on the name stays for the rest of the call
      const joinedA = T >= FIRST_A - .3;
      agentNow = cur && cur.k === 'a';
      stO = joinedA ? 0 : 1; agO = joinedA ? 1 : 0;
    }
    return {
      status: s.muted ? 'MUTED' : 'LISTENING', stO: stO,
      agO: agO, agY: 0, /* no nudge: the name lands exactly where LISTENING was */ nmO: agO ? .9 : 0,
      hs: agentNow ? (1 + (s.A - .85) * .9).toFixed(3) : 1, ho: agentNow ? .9 : .25,
      fs: (1 + (s.L - .6) * .885).toFixed(3), fo: s.muted ? .1 : clamp((s.L - .22) * 2.2).toFixed(2),
      as: (.8 + s.A * .3).toFixed(3), ao: clamp(s.A * 1.4).toFixed(2),
      murmurs: murmurs, words: words, rO: rO, rB: rB, rY: rY,
      muted: s.muted, slash: s.muted ? 1 : 0, unm: s.muted ? 0 : 1, muteLabel: s.muted ? 'Unmute' : 'Mute',
      toggleMute: () => { if (this.stream) this.stream.getAudioTracks().forEach(t => { t.enabled = s.muted; }); this.setState({ muted: !s.muted }); }
    };
  }
}
