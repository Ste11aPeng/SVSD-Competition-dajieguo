<body>

<div class="stage" id="stage"><div class="scr"><iframe id="app" title="Vent On prototype" allow="clipboard-write; microphone; autoplay"></iframe></div></div>
<button class="restart" id="restart" type="button">Restart</button>
<script>
(function(){
  const st=document.getElementById('stage'),fr=document.getElementById('app');
  function fit(){const s=Math.min(1,(innerHeight-40)/920,(innerWidth-32)/450);st.style.setProperty('--s',s)}
  addEventListener('resize',fit);fit();
  function start(){try{localStorage.setItem('hc.stage','home');sessionStorage.removeItem('lava.forgot')}catch(e){}fr.src='vent.html?t='+Date.now()}
  document.getElementById('restart').addEventListener('click',start);
  start();
})();
</script>
