.cell{position:absolute;width:46px;height:46px;border:0;padding:0;border-radius:14px;background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;isolation:isolate;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .35s,opacity .35s}

.mcell{position:absolute;width:46px;height:46px;box-sizing:border-box;border-radius:13px;border:0;padding:0 0 4px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;font-family:'Geist',sans-serif;font-size:11px;overflow:hidden;isolation:isolate;transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}

.crs{position:absolute;left:0;right:0;bottom:14px;height:226px;display:flex;gap:10px;padding:0 16px;box-sizing:border-box;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

.ic{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025) 60%);display:flex;flex-direction:column}

.crs{height:316px!important}

/* X5: reference card surface, quieter type */
.ic{width:284px!important;height:300px!important;padding:18px 20px!important;border-radius:16px!important;background:linear-gradient(180deg,#2A2D44 0%,#24273C 55%,#212437 100%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(255,255,255,.035),0 18px 36px -22px rgba(0,0,0,.7)!important}

.disp{font-family:'Geist',-apple-system,sans-serif!important;font-weight:600!important;letter-spacing:-.02em!important}
p.disp{color:var(--t1)}

/* header + glass toggle */

/* one weight system, tighter leading */
.navt,.fc h3,.dt,.disp,.trow .nm,.dp h4,.bl b,.va,.status{font-weight:500!important}
.ult,.ins .t,.dp .lead,.dp .quote,.dr,.dp .note,.trow .nm small{font-weight:400!important}
.ult{line-height:1.4!important;font-size:16.5px!important}
.ins .t{line-height:1.4!important}
.dp .lead{line-height:1.42!important}
.dr{line-height:1.38!important}
.dp .note,.sum{line-height:1.45!important}
.ins{padding:12px 0!important}
.ins .m{display:flex;align-items:center;gap:7px;margin-top:5px!important}
.mk{width:9px;height:9px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),var(--mc) 55%);box-shadow:0 0 8px var(--mc)}

/* nav: progressive blur, darker toward the top */
.sticky{height:150px!important;background:linear-gradient(180deg,rgba(6,5,9,1) 0%,rgba(6,5,9,.94) 30%,rgba(6,5,9,.7) 55%,rgba(6,5,9,.3) 78%,rgba(6,5,9,0) 100%)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;-webkit-mask:none!important;mask:none!important}
.pb{position:absolute;left:0;right:0;top:0;height:150px;pointer-events:none}
.pb1{-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask:linear-gradient(180deg,#000 0%,#000 70%,transparent 100%);mask:linear-gradient(180deg,#000 0%,#000 70%,transparent 100%)}
.pb2{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask:linear-gradient(180deg,#000 0%,#000 50%,transparent 80%);mask:linear-gradient(180deg,#000 0%,#000 50%,transparent 80%)}
.pb3{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);-webkit-mask:linear-gradient(180deg,#000 0%,#000 32%,transparent 60%);mask:linear-gradient(180deg,#000 0%,#000 32%,transparent 60%)}
.pb4{-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);-webkit-mask:linear-gradient(180deg,#000 0%,transparent 40%);mask:linear-gradient(180deg,#000 0%,transparent 40%)}
.navt{z-index:1}
.ins .d{display:inline-flex;align-items:center;gap:6px}
.mk.rt{width:8px;height:8px}
/* one clean fade on view switch: out, swap while hidden, back in */
.inner{transition:opacity .22s ease!important}
.view{transition:none!important}
/* tag above the line, quieter colour */
.ins{grid-template-rows:auto auto}
.ins .m{grid-column:1!important;grid-row:1!important;margin:0 0 6px!important;font-size:12px!important;color:rgba(236,232,242,.48)!important}
.ins .d{grid-column:2!important;grid-row:1!important;padding-top:0!important;align-self:start}
.ins .t{grid-column:1 / -1!important;grid-row:2!important;color:rgba(236,232,242,.82)!important}
.ins .m .mk{width:7px;height:7px;box-shadow:0 0 6px var(--mc)}
/* tidy rows: tag and date share the first line, no stray gaps */
.fc h3{margin-bottom:12px!important}
.ins{padding:12px 0!important;row-gap:0}
.fc h3 + .ins,.fc .ult + .ins,.fc > .ins:first-of-type{padding-top:0!important;border-top:0!important}
.ins .d:empty{display:none}
.ins .m{align-self:center}
.ins .d{line-height:18px}
.ins .m{line-height:18px}
/* equal padding top and bottom in every card */
.fc{padding:20px!important}
.fc > *:last-child{margin-bottom:0!important}
.fc > .ins:last-of-type{padding-bottom:0!important}
.fc .va{margin-top:16px!important;margin-bottom:0!important}
.fc h3{margin-top:0!important}
.fc .ult{margin-top:0!important}
.fc[style*="padding-top: 6px"]{padding-top:8px!important;padding-bottom:8px!important}

/* X24: chat button, toggle that names the active view, chips above the blobs */
.chatbtn{position:absolute;left:18px;top:51px;width:40px;height:40px;border:0;padding:0;border-radius:50%;cursor:pointer;z-index:17;display:grid;place-items:center;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.chatbtn:active{transform:scale(.96)}
.seg2{position:absolute;right:18px;top:51px;display:flex;gap:2px;padding:3px;border-radius:20px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);z-index:17}
.seg2 button{height:34px;min-width:42px;padding:0 12px;border:0;border-radius:17px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;font-family:'Geist',sans-serif;font-size:13px;font-weight:500;color:rgba(236,232,242,.92);transition:background .3s,opacity .3s,padding .35s cubic-bezier(.3,1,.4,1)}
.seg2 button svg{flex:none}
.seg2 button[aria-pressed="true"]{background:rgba(255,255,255,.14);opacity:1;padding:0 14px 0 11px}
.seg2 .lb{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;margin-left:0;transition:max-width .35s cubic-bezier(.3,1,.4,1),opacity .25s,margin .35s}
.seg2 button[aria-pressed="true"] .lb{max-width:80px;opacity:1;margin-left:7px}
.sticky,.pb{height:118px!important}

/* X27: softer topic swap, coloured titles, lighter sheet */
.fswap{will-change:opacity,filter,transform}
.cnt{color:var(--t3);font-weight:400;margin-left:4px}
.dt .cnt{margin-left:2px;font-size:22px}
.ds{display:flex;align-items:center;gap:9px;margin-top:6px!important;font-size:13px;color:var(--t2)}
.ds .dots{display:inline-flex;gap:4px}.ds .dots i{width:7px;height:7px;border-radius:50%}
.ins .t{grid-column:1!important;grid-row:2!important}
.ins .d{grid-column:2!important;grid-row:2!important;align-self:start!important;padding-top:1px!important}
.spark{margin:2px 0 16px}.spark svg{display:block;width:100%;height:64px;overflow:visible}
.spl{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--t3)}
.dins{margin-top:16px;display:grid;gap:10px}
.di{margin:0;display:flex;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.4;color:var(--t1)}
.di .mk{flex:none;width:7px;height:7px;transform:translateY(-1px)}
.open{margin-top:22px;padding:18px;border-radius:18px;background:color-mix(in srgb,var(--oc) 11%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--oc) 22%,transparent)}
.ol{margin:0 0 8px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--oc) 75%,#fff)}
.ol span{color:var(--t3);font-weight:400}
.ot{margin:0;font-size:16px;font-weight:500;color:var(--t1)}
.os{margin:4px 0 14px;font-size:13.5px;line-height:1.45;color:var(--t2)}
.ob{display:flex;gap:8px}
.ob button{flex:1;height:40px;border:0;border-radius:12px;font-family:'Geist',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer}
.ob1{background:color-mix(in srgb,var(--oc) 85%,#fff);color:#0A090E}
.ob2{background:rgba(255,255,255,.08);color:var(--t1)}
.open + .dp{margin-top:22px!important}
.dp .lead.up{font-size:15px!important;color:var(--t2)}

/* X28: progressive blur above the half sheet */
.dscrim{background:linear-gradient(180deg,rgba(5,4,8,.82) 0%,rgba(5,4,8,.6) 28%,rgba(5,4,8,.42) 60%,rgba(5,4,8,.38) 100%)!important;-webkit-backdrop-filter:blur(2px)!important;backdrop-filter:blur(2px)!important}
.sb{position:absolute;left:0;right:0;top:0;height:300px;pointer-events:none;z-index:39;transition:opacity .45s}
.sb1{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);-webkit-mask:linear-gradient(180deg,#000 0%,#000 70%,transparent 100%);mask:linear-gradient(180deg,#000 0%,#000 70%,transparent 100%)}
.sb2{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask:linear-gradient(180deg,#000 0%,#000 48%,transparent 78%);mask:linear-gradient(180deg,#000 0%,#000 48%,transparent 78%)}
.sb3{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-mask:linear-gradient(180deg,#000 0%,#000 28%,transparent 56%);mask:linear-gradient(180deg,#000 0%,#000 28%,transparent 56%)}
.sb4{-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);-webkit-mask:linear-gradient(180deg,#000 0%,transparent 40%);mask:linear-gradient(180deg,#000 0%,transparent 40%)}

/* shadow under the sheet's top edge once its content scrolls */
.dfade{position:absolute;left:0;right:0;top:0;height:72px;border-radius:30px 30px 0 0;pointer-events:none;z-index:1;transition:opacity .25s;background:linear-gradient(180deg,#121117 0%,rgba(18,17,23,.92) 30%,rgba(18,17,23,0) 100%);box-shadow:0 10px 24px -12px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask:linear-gradient(180deg,#000 45%,transparent 100%);mask:linear-gradient(180deg,#000 45%,transparent 100%)}
.xbtn{z-index:3!important}.grab{z-index:3!important}

/* X29: settled ring, stronger scroll shadow */
.ds .pie{flex:none}

.dt{display:flex;align-items:center}
.dt .tring{margin-left:10px;flex:none}

/* X31: compact card, gradient instead of blur, reference calendar chip */

/* X32: card first, framed calendar chip, coloured drop shadow */
.open2{margin:0 0 26px!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 22px 40px -16px color-mix(in srgb,var(--oc) 70%,transparent),0 8px 22px -10px color-mix(in srgb,var(--oc) 50%,transparent)!important}

  work: { learned: 'Across five talks, the hardest moments were when your effort went unnoticed: the slides, the case study. You felt better each time you said plainly what you wanted.', up: ['Oct 1 · Your manager presented your slides as her own', 'Oct 12 · Rejected in two lines after three rounds', 'Oct 16 · You applied for a new role'], coped: 'Saying what stung helped in three of five talks. Writing the reply you wished you could send helped too, as long as you didn’t send it.', helped: 'It agreed it was unfair first, then asked what you actually wanted. Your next talk was half as long.' },
